<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160">
  <!-- Seamless tile for the JOINT page title: a deep forest of pines and cannabis leaves, laid over a
       green gradient and clipped to the letters. Shapes stay inside the tile so it repeats cleanly. -->
  <defs>
    <g id="leaf">
      <ellipse cx="0" cy="-13" rx="2.6" ry="13" />
      <ellipse cx="0" cy="-11" rx="2.3" ry="11" transform="rotate(-28)" />
      <ellipse cx="0" cy="-11" rx="2.3" ry="11" transform="rotate(28)" />
      <ellipse cx="0" cy="-8.5" rx="2" ry="8.5" transform="rotate(-58)" />
      <ellipse cx="0" cy="-8.5" rx="2" ry="8.5" transform="rotate(58)" />
      <ellipse cx="0" cy="-5.5" rx="1.6" ry="5.5" transform="rotate(-88)" />
      <ellipse cx="0" cy="-5.5" rx="1.6" ry="5.5" transform="rotate(88)" />
      <rect x="-0.7" y="0" width="1.4" height="7" rx="0.7" />
    </g>
    <g id="pine">
      <path d="M0 -26 L9 -12 L5 -12 L12 0 L7 0 L15 12 L-15 12 L-7 0 L-12 0 L-5 -12 L-9 -12 Z" />
      <rect x="-1.8" y="12" width="3.6" height="5" />
    </g>
  </defs>

  <!-- Back row of pines: darkest. -->
  <g fill="#06210f" opacity="0.85">
    <use href="#pine" transform="translate(22 52) scale(1.1)" />
    <use href="#pine" transform="translate(100 40) scale(0.9)" />
    <use href="#pine" transform="translate(140 118) scale(1.15)" />
    <use href="#pine" transform="translate(58 128) scale(0.85)" />
  </g>

  <!-- Cannabis leaves in a few greens. -->
  <g fill="#2f8f3a">
    <use href="#leaf" transform="translate(64 72) rotate(-12) scale(1.15)" />
    <use href="#leaf" transform="translate(132 62) rotate(18)" />
  </g>
  <g fill="#7cc142">
    <use href="#leaf" transform="translate(28 112) rotate(10) scale(0.9)" />
    <use href="#leaf" transform="translate(110 132) rotate(-20) scale(0.8)" />
  </g>
  <g fill="#14532d">
    <use href="#leaf" transform="translate(92 98) rotate(32) scale(0.75)" />
    <use href="#leaf" transform="translate(16 24) rotate(-30) scale(0.7)" />
  </g>

  <!-- Light through the canopy. -->
  <g fill="#d9f99d" opacity="0.55">
    <circle cx="44" cy="20" r="2" />
    <circle cx="118" cy="16" r="1.6" />
    <circle cx="80" cy="44" r="1.3" />
    <circle cx="150" cy="88" r="1.8" />
    <circle cx="8" cy="80" r="1.4" />
    <circle cx="84" cy="152" r="1.6" />
  </g>
</svg>
