<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="140" height="140" viewBox="0 0 140 140">
  <!-- Seamless tile for the "JOINT" wordmark: 70s flower power. Shapes stay inside the tile so
       the repeat has no seams; varied rotation and size hide the grid. -->
  <defs>
    <g id="petal8"><ellipse cx="0" cy="-8.5" rx="3.6" ry="7.6"/></g>
    <g id="daisy" stroke="#2a1532" stroke-width="1.1">
      <use xlink:href="#petal8"/>
      <use xlink:href="#petal8" transform="rotate(45)"/>
      <use xlink:href="#petal8" transform="rotate(90)"/>
      <use xlink:href="#petal8" transform="rotate(135)"/>
      <use xlink:href="#petal8" transform="rotate(180)"/>
      <use xlink:href="#petal8" transform="rotate(225)"/>
      <use xlink:href="#petal8" transform="rotate(270)"/>
      <use xlink:href="#petal8" transform="rotate(315)"/>
    </g>
    <path id="blade" d="M0 0 C -3.4 -7, -3.6 -17, 0 -26 C 3.6 -17, 3.4 -7, 0 0 Z"/>
    <g id="leaf" fill="#3fae4a" stroke="#1d3b1f" stroke-width="1">
      <path d="M0 0 L0 12" fill="none" stroke-width="1.6"/>
      <use xlink:href="#blade" transform="rotate(-78) scale(0.5)"/>
      <use xlink:href="#blade" transform="rotate(-52) scale(0.72)"/>
      <use xlink:href="#blade" transform="rotate(-26) scale(0.9)"/>
      <use xlink:href="#blade"/>
      <use xlink:href="#blade" transform="rotate(26) scale(0.9)"/>
      <use xlink:href="#blade" transform="rotate(52) scale(0.72)"/>
      <use xlink:href="#blade" transform="rotate(78) scale(0.5)"/>
    </g>
    <g id="eye">
      <path d="M-11 0 C -6 -7, 6 -7, 11 0 C 6 7, -6 7, -11 0 Z" fill="#fdfcfa" stroke="#1f1f1f" stroke-width="1.3"/>
      <circle r="3.9" fill="#3b2f26"/>
      <circle r="1.8" fill="#0d0b09"/>
      <circle cx="1.3" cy="-1.4" r="0.9" fill="#fff"/>
    </g>
  </defs>

  <!-- Daisies -->
  <g transform="translate(28 28) rotate(12)">
    <use xlink:href="#daisy" fill="#fff4e8"/>
    <circle r="5" fill="#ffb31a" stroke="#2a1532" stroke-width="1.1"/>
    <circle r="1.6" fill="#e2482f"/>
  </g>
  <g transform="translate(108 52) rotate(-20) scale(0.72)">
    <use xlink:href="#daisy" fill="#ff5fa2"/>
    <circle r="5" fill="#ffe24a" stroke="#2a1532" stroke-width="1.3"/>
  </g>
  <g transform="translate(46 118) rotate(33) scale(0.6)">
    <use xlink:href="#daisy" fill="#7fd3ff"/>
    <circle r="5" fill="#ff7a1a" stroke="#2a1532" stroke-width="1.5"/>
  </g>

  <!-- Retro five-petal flower -->
  <g transform="translate(82 102) rotate(-8)" stroke="#2a1532" stroke-width="1.1">
    <circle cx="0" cy="-9" r="7" fill="#ff8a1f"/>
    <circle cx="8.6" cy="-2.8" r="7" fill="#ff8a1f"/>
    <circle cx="5.3" cy="7.3" r="7" fill="#ff8a1f"/>
    <circle cx="-5.3" cy="7.3" r="7" fill="#ff8a1f"/>
    <circle cx="-8.6" cy="-2.8" r="7" fill="#ff8a1f"/>
    <circle r="5.4" fill="#7a3fc4"/>
    <circle r="2" fill="#ffe24a" stroke="none"/>
  </g>

  <!-- Cannabis leaves -->
  <use xlink:href="#leaf" transform="translate(22 92) rotate(-24) scale(0.62)"/>
  <use xlink:href="#leaf" transform="translate(120 118) rotate(34) scale(0.48)"/>
  <use xlink:href="#leaf" transform="translate(76 46) rotate(168) scale(0.42)"/>

  <!-- Tiny eyes -->
  <use xlink:href="#eye" transform="translate(70 18) rotate(-6) scale(0.95)"/>
  <use xlink:href="#eye" transform="translate(116 84) rotate(14) scale(0.7)"/>

  <!-- Mushroom -->
  <g transform="translate(50 66) rotate(-10)" stroke="#2a1532" stroke-width="1.1">
    <path d="M-3.4 0 L-2.6 9 C -1 10.4, 1 10.4, 2.6 9 L3.4 0 Z" fill="#fff4e8"/>
    <path d="M-11 1 C -11 -9, 11 -9, 11 1 Z" fill="#e23b3b"/>
    <circle cx="-5" cy="-3.2" r="1.6" fill="#fff4e8" stroke="none"/>
    <circle cx="2" cy="-5" r="1.9" fill="#fff4e8" stroke="none"/>
    <circle cx="6.4" cy="-1.4" r="1.2" fill="#fff4e8" stroke="none"/>
  </g>

  <!-- Swirls -->
  <path d="M104 22 c 0 -4 6 -4 6 0 c 0 6 -11 6 -11 -1 c 0 -9 15 -9 15 1" fill="none" stroke="#2a1532" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M14 58 c 3 -3 8 0 5 3 c -4 4 -10 -1 -6 -6 c 5 -6 14 0 10 7" fill="none" stroke="#7a3fc4" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Dots -->
  <g stroke="#2a1532" stroke-width="0.8">
    <circle cx="92" cy="10" r="2.4" fill="#ffe24a"/>
    <circle cx="10" cy="128" r="2.2" fill="#ff5fa2"/>
    <circle cx="132" cy="30" r="1.8" fill="#3fae4a"/>
    <circle cx="64" cy="132" r="2" fill="#7fd3ff"/>
    <circle cx="30" cy="72" r="1.6" fill="#ff8a1f"/>
    <circle cx="128" cy="68" r="1.5" fill="#fff4e8"/>
  </g>
</svg>
